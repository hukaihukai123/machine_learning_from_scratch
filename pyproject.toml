[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-from-scratch-hukai"
version = "0.2.0"
description = "Educational NumPy implementations of classical machine-learning algorithms"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "scipy>=1.10,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "scikit-learn>=1.3,<2", "matplotlib>=3.7,<4"]

[tool.setuptools]
py-modules = ["config"]

[tool.setuptools.packages.find]
include = ["models*", "utils*"]
exclude = ["models.neural network*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
